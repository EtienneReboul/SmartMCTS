[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-mcts"
version = "0.1.0"
description = "Graph-based Monte Carlo Tree Search that assembles drug-like molecules from chemically meaningful blocks, guided by a PUCT prior learned from real datasets."
readme = "README.md"
authors = [
  {name = "Etienne Reboul", email = "reeetienne@gmail.com"}
]
maintainers = [
  {name = "Etienne Reboul", email = "reeetienne@gmail.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
  "rdkit",
  "numpy",
  "pandas",
  "pooch",
  "tqdm",
]
requires-python = ">= 3.11"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
bugs = "https://github.com/EtienneReboul/smart-mcts/issues"
changelog = "https://github.com/EtienneReboul/smart-mcts/releases"
documentation = "https://EtienneReboul.github.io/smart-mcts/"
homepage = "https://github.com/EtienneReboul/smart-mcts"

[project.scripts]
smart_mcts = "smart_mcts.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]

[tool.ruff.lint.per-file-ignores]
# Curated R-BRICS SMARTS definitions: a data table of long pattern strings that
# cannot be wrapped without hurting readability.
"src/smart_mcts/rbrics_patterns.py" = ["E501"]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_mcts"]

[tool.uv]
package = true
default-groups = ["dev"]
